version: 2.1

# CI for the website: the site in apps/website/web and its API in apps/website/api, plus the
# desktop app's Linux end-to-end shards. The rest of the repo (the desktop's unit tests and its
# macOS end-to-end shards, mobile, server core) still runs on GitHub Actions, in
# .github/workflows/ci.yml, which has a circleci job for each job here that waits for it.
#
# Left out for now: path filtering (every push runs every job), matrices, other operating systems
# and deploys.
#
# The unit, monitoring and integration tests are circleci testsuite run (see test-suites.yml). It
# runs the same tests as before, with free static splitting across a job's parallelism and a rerun
# of only the failed tests when a workflow is rerun from failed. The API suites take a test class
# as their atom (dotnet-suite.sh). The Playwright specs are plain steps instead: they share one
# slow start (the site build and the admin stack) and admin-captcha runs after admin, so splitting
# them over nodes would cost more than it saves.

commands:
  # Node 26, the latest release, as the GitHub jobs' setup-node had (check-latest). It goes under
  # the home folder and first on the PATH, since the machine image has its own Node.
  install-node:
    steps:
      - run:
          name: Install Node
          command: |
            fetch() {
              curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 "$@"
            }
            dist=https://nodejs.org/dist/latest-v26.x
            fetch "$dist/SHASUMS256.txt" -o /tmp/node-shasums.txt
            file=$(awk '$2 ~ /linux-x64\.tar\.xz$/ { print $2 }' /tmp/node-shasums.txt)
            fetch "$dist/$file" -o "/tmp/$file"
            (cd /tmp && grep " $file\$" node-shasums.txt | sha256sum -c -)
            mkdir -p "$HOME/node"
            tar -xJf "/tmp/$file" -C "$HOME/node" --strip-components=1
            echo "export PATH=\"$HOME/node/bin:\$PATH\"" >> "$BASH_ENV"
            "$HOME/node/bin/node" --version

  # The 10.0.4xx band that apps/website/api/global.json names (its rollForward is latestPatch), the
  # latest release in it, which is what the GitHub job's setup-dotnet takes too. A fresh machine
  # fetches from the internet, so the download and the installer retry.
  install-dotnet:
    steps:
      - run:
          name: Install the .NET SDK
          command: |
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 \
              https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            for attempt in 1 2 3; do
              bash /tmp/dotnet-install.sh --channel 10.0.4xx --install-dir "$HOME/.dotnet" && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
            echo 'export DOTNET_ROOT="$HOME/.dotnet"' >> "$BASH_ENV"
            echo 'export PATH="$HOME/.dotnet:$PATH"' >> "$BASH_ENV"
            "$HOME/.dotnet/dotnet" --version

executors:
  node:
    docker:
      - image: cimg/node:26.13
    resource_class: large
  # The API's integration tests start PostgreSQL and RabbitMQ with Testcontainers, so they need a
  # Docker daemon they can reach, which only the machine executor gives. There is no cimg image
  # with the .NET SDK either, so the job installs the SDK itself.
  linux-machine:
    machine:
      image: ubuntu-2404:current
    resource_class: large

jobs:
  website-web:
    executor: node
    steps:
      - checkout

      # The Bun the site's Dockerfile builds with, which the build script and seoCheck run under.
      - run:
          name: Install Bun
          command: npm install --global bun@1.4.4

      - restore_cache:
          keys:
            - bun-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}
            - bun-v1-{{ arch }}-
      - run:
          name: Install dependencies
          working_directory: apps/website/web
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}
          paths:
            - ~/.bun/install/cache

      # Astro's cache of optimized images. Each cached file is named by a hash of its source and
      # transform, so a changed screenshot is never served from an old one. Without it the build
      # spends about 8 minutes encoding them. Restored after the install, which owns node_modules.
      - run:
          name: Hash the site's images
          command: find apps/website/web/src/assets -type f | sort | xargs sha256sum > /tmp/site-assets.sha
      - restore_cache:
          keys:
            - astro-assets-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}-{{ checksum "/tmp/site-assets.sha" }}
            - astro-assets-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}-

      # Lint, types, tests and the build all run, so one failure does not hide the others.
      - run:
          name: Lint
          working_directory: apps/website/web
          command: bunx biome ci .
      - run:
          name: Astro check
          when: always
          working_directory: apps/website/web
          command: bun run check
      - run:
          name: Unit tests
          when: always
          working_directory: apps/website/web
          command: circleci testsuite run "website web unit tests"
      - store_test_results:
          path: apps/website/web/test-reports
      - run:
          name: Build
          when: always
          working_directory: apps/website/web
          command: bun run build
      - save_cache:
          key: astro-assets-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}-{{ checksum "/tmp/site-assets.sha" }}
          paths:
            - apps/website/web/node_modules/.astro/assets

  # The API in apps/website/api. Three parallel nodes, as the GitHub job's three shards were: each
  # builds, then circleci testsuite run takes its third of every suite's test classes. The format
  # check runs on the first node only.
  website-api:
    executor: linux-machine
    parallelism: 3
    environment:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - checkout

      - install-dotnet

      - run:
          name: Hash the lock files
          command: find apps/website/api -name packages.lock.json | sort | xargs sha256sum > /tmp/nuget-locks.sha
      - restore_cache:
          keys:
            - nuget-v1-{{ arch }}-{{ checksum "/tmp/nuget-locks.sha" }}
            - nuget-v1-{{ arch }}-
      # Locked: the lock files are what was reviewed. A known high or critical vulnerability fails
      # this step through NuGet audit.
      - run:
          name: Restore
          working_directory: apps/website/api
          command: dotnet restore Runova.Website.slnx --locked-mode
      - save_cache:
          key: nuget-v1-{{ arch }}-{{ checksum "/tmp/nuget-locks.sha" }}
          paths:
            - ~/.nuget/packages
      - run:
          name: Build
          working_directory: apps/website/api
          command: dotnet build Runova.Website.slnx --no-restore --configuration Release

      # Each suite is split over the three nodes on its own, so a node gets a third of the unit
      # tests, of the monitoring tests and of the integration tests. They all run, so one failing
      # suite does not hide the others.
      - run:
          name: Unit tests
          working_directory: apps/website/api
          command: circleci testsuite run "website api unit tests"
      - run:
          name: Monitoring tests
          when: always
          working_directory: apps/website/api
          command: circleci testsuite run "website api monitoring tests"
      # Every test host starts its own PostgreSQL with Testcontainers, so this takes the longest.
      - run:
          name: Integration tests
          when: always
          no_output_timeout: 30m
          working_directory: apps/website/api
          command: circleci testsuite run "website api integration tests"
      - store_test_results:
          path: apps/website/api/test-reports

      - run:
          name: Format
          when: always
          working_directory: apps/website/api
          command: |
            if [ "$CIRCLE_NODE_INDEX" = 0 ]; then
              dotnet format Runova.Website.slnx --verify-no-changes --no-restore
            fi

  # The Playwright specs against the real thing: the site with a fake API, the site with the real
  # API and PostgreSQL (the admin project), then the compose stack the way production runs it,
  # with the full-stack specs and Lighthouse against it. The machine executor is a plain Ubuntu VM
  # with Docker, which is what the Mac mini's Tart VM was when this ran on GitHub Actions, so it
  # installs the same toolchain that VM had: Node, Bun and the .NET SDK.
  website-e2e:
    executor: linux-machine
    environment:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      COMPOSE_PROJECT_NAME: runova-e2e-website
      HTTP_PORT: "18080"
      HTTPS_PORT: "18443"
      STACK_URL: https://localhost:18443
      STACK_HTTP_URL: http://localhost:18080
    steps:
      - checkout

      - install-node
      # The Bun the site's Dockerfile builds with, from npm as in website-web.
      - run:
          name: Install Bun
          command: |
            npm install --global --silent --fetch-retries=5 bun@1.4.4
            echo "Bun $(bun --version)"
      - install-dotnet

      - run:
          name: Hash the lock files and images
          command: |
            find apps/website/api -name packages.lock.json | sort | xargs sha256sum > /tmp/nuget-locks.sha
            find apps/website/web/src/assets -type f | sort | xargs sha256sum > /tmp/site-assets.sha
      # Restored only: website-web and website-api save these, with the same keys.
      - restore_cache:
          keys:
            - bun-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}
            - bun-v1-{{ arch }}-
      - restore_cache:
          keys:
            - nuget-v1-{{ arch }}-{{ checksum "/tmp/nuget-locks.sha" }}
            - nuget-v1-{{ arch }}-
      - restore_cache:
          keys:
            - astro-assets-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}-{{ checksum "/tmp/site-assets.sha" }}
            - astro-assets-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}-

      - run:
          name: Install dependencies
          working_directory: apps/website/web
          command: bun install --frozen-lockfile

      # Built first, so the optimized images are in the cache folder when Playwright's web server
      # builds again (it gives that build 4 minutes) and when the compose image build reuses them.
      - run:
          name: Build
          working_directory: apps/website/web
          command: bun run build
      - save_cache:
          key: astro-assets-v1-{{ arch }}-{{ checksum "apps/website/web/bun.lock" }}-{{ checksum "/tmp/site-assets.sha" }}
          paths:
            - apps/website/web/node_modules/.astro/assets

      # With the system libraries Chromium needs, which the image does not have.
      - run:
          name: Playwright browser
          working_directory: apps/website/web
          command: bunx playwright install --with-deps chromium

      - run:
          name: End-to-end tests
          no_output_timeout: 30m
          working_directory: apps/website/web
          environment:
            PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-reports/website-e2e.xml
          command: bun run e2e --reporter=list,junit

      # SITE_URL only here: the e2e build above must keep the default, which its fixtures (and
      # the CSP that allows their runovahq.com images) expect. compose.test.yaml adds the
      # telemetry sink that the secrets spec reads.
      - run:
          name: Start the compose stack
          when: always
          no_output_timeout: 30m
          working_directory: apps/website/web
          environment:
            SITE_URL: https://localhost:18443
          command: |
            docker compose -f ../compose.yaml -f ../compose.test.yaml up --detach --build --wait
            touch /tmp/stack-is-up
      - run:
          name: Full-stack tests
          when: always
          working_directory: apps/website/web
          environment:
            PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-reports/website-stack.xml
          command: |
            if [ ! -e /tmp/stack-is-up ]; then
              echo "The stack did not come up, so its specs cannot run."
              exit 1
            fi
            bun run e2e:stack --reporter=list,junit
      # Even when a full-stack spec fails, but only on a stack that came up.
      - run:
          name: Lighthouse against the stack
          when: always
          working_directory: apps/website/web
          command: |
            if [ ! -e /tmp/stack-is-up ]; then
              echo "The stack did not come up, so there is nothing to audit."
              exit 0
            fi
            bun run lighthouse:stack
      - run:
          name: Stack logs
          when: on_fail
          working_directory: apps/website/web
          command: docker compose -f ../compose.yaml -f ../compose.test.yaml logs --no-color --tail 300 || true

      # The store steps below fail on a folder that was never made, as on a run that stopped early.
      - run:
          name: Make the report folders
          when: always
          working_directory: apps/website/web
          command: mkdir -p test-reports test-results .lighthouseci
      - store_test_results:
          path: apps/website/web/test-reports
      # Traces and screenshots of failed specs, and the Lighthouse reports.
      - store_artifacts:
          path: apps/website/web/test-results
      - store_artifacts:
          path: apps/website/web/.lighthouseci

  # The desktop app's Playwright specs on Linux: Electron under Xvfb, split into three shards by
  # spec file as test.yml's "E2E (linux, n/3)" jobs were. Each parallel node runs Playwright's own
  # --shard=n/3, so the split is the one it always was, and not a Smarter Testing suite. The
  # machine executor is a plain Ubuntu 24.04 VM, which is what the self-hosted runner's job
  # container is (.github/ci-container), so the system packages below are that image's list.
  desktop-e2e-linux:
    executor: linux-machine
    parallelism: 3
    environment:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # The VM has no usable Chromium sandbox, so the launcher drops it rather than having Electron
      # refuse to start. Two spec files at a time, each with its own Electron and its own Xvfb
      # (apps/desktop/e2e/displays.ts).
      RUNOVA_E2E_NO_SANDBOX: "1"
      RUNOVA_E2E_WORKERS: "2"
      # A report is written, never served.
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - checkout

      - run:
          name: Install the system packages
          command: |
            echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
            sudo apt-get update -q
            # Electron's libraries, Xvfb, ffmpeg (the Studio render spec skips itself without it)
            # and the build tools electron-rebuild needs.
            sudo apt-get install -y -q --no-install-recommends \
              build-essential pkg-config python3 git openssh-client \
              xvfb xauth x11-utils ffmpeg fonts-liberation fonts-dejavu-core \
              libnss3 libnspr4 libgbm1 libdrm2 libxss1 libxtst6 libx11-6 libxcb1 libxext6 libxfixes3 \
              libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libdbus-1-3 libpango-1.0-0 libcairo2 \
              libwayland-client0 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
              libcups2t64 libglib2.0-0t64 libgtk-3-0t64
            # Ubuntu blocks the unprivileged user namespaces Chromium's sandbox needs.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - install-node
      # The pnpm the root package.json pins. Its store and the Electron download sit in the home
      # folder, which the caches below keep.
      - run:
          name: Install pnpm
          command: |
            version=$(sed -n 's/.*"packageManager": *"pnpm@\([^"]*\)".*/\1/p' package.json)
            npm install --global --silent --fetch-retries=5 "pnpm@$version"
            echo 'export pnpm_config_store_dir="$HOME/.pnpm-store"' >> "$BASH_ENV"
            echo 'export electron_config_cache="$HOME/.cache/electron"' >> "$BASH_ENV"
            echo "pnpm $(pnpm --version)"
      - install-dotnet

      - run:
          name: Hash the server core's lock files
          command: find apps/server-core -name packages.lock.json | sort | xargs sha256sum > /tmp/core-locks.sha
      - restore_cache:
          keys:
            - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-{{ arch }}-
      - restore_cache:
          keys:
            - electron-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - electron-v1-{{ arch }}-
      # The Deploy specs build and start the server core's DevHost.
      - restore_cache:
          keys:
            - nuget-core-v1-{{ arch }}-{{ checksum "/tmp/core-locks.sha" }}
            - nuget-core-v1-{{ arch }}-

      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      # electron is not in allowBuilds, so its postinstall never fetched the runtime. The CDN is
      # occasionally flaky, hence the retries.
      - run:
          name: Install the Electron binary
          command: |
            for attempt in 1 2 3; do
              pnpm --filter @runova/desktop exec install-electron && exit 0
              echo "attempt $attempt failed, retrying in 15s"
              sleep 15
            done
            exit 1
      - save_cache:
          key: electron-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/electron
      - run:
          name: Build the workspace packages
          command: pnpm build:packages
      # better-sqlite3 has to match Electron's ABI to load inside the app.
      - run:
          name: Rebuild the native modules for Electron
          command: pnpm --filter @runova/desktop rebuild:native
      # A global git config of the job's own, which the app under test inherits for its fixtures.
      - run:
          name: Git identity for the fixtures
          command: |
            git config --file "$HOME/e2e-gitconfig" user.name "Runova CI"
            git config --file "$HOME/e2e-gitconfig" user.email "ci@runova.invalid"
            echo 'export GIT_CONFIG_GLOBAL="$HOME/e2e-gitconfig"' >> "$BASH_ENV"

      - run:
          name: End-to-end tests
          no_output_timeout: 30m
          command: |
            shard="$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL"
            export PLAYWRIGHT_JUNIT_OUTPUT_FILE="test-reports/desktop-e2e-$((CIRCLE_NODE_INDEX + 1)).xml"
            pnpm --filter @runova/desktop test:e2e --shard="$shard" --reporter=list,html,junit
      - save_cache:
          when: always
          key: nuget-core-v1-{{ arch }}-{{ checksum "/tmp/core-locks.sha" }}
          paths:
            - ~/.nuget/packages

      # The store steps below fail on a folder that was never made, as on a run that stopped early.
      - run:
          name: Make the report folders
          when: always
          command: mkdir -p apps/desktop/test-reports apps/desktop/test-results apps/desktop/playwright-report
      - store_test_results:
          path: apps/desktop/test-reports
      # The HTML report, and the traces and screenshots of failed specs.
      - store_artifacts:
          path: apps/desktop/playwright-report
      - store_artifacts:
          path: apps/desktop/test-results

workflows:
  website:
    jobs:
      - website-web
      - website-api
      - website-e2e
  desktop:
    jobs:
      - desktop-e2e-linux
