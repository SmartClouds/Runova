packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  cpu-features: false
  electron-winstaller: true
  esbuild: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - autoprefixer@10.5.4
  - caniuse-lite@1.0.30001806
  - vite@8.2.1
  - postcss@8.5.26
  - '@biomejs/biome@2.5.8'
  - '@biomejs/cli-darwin-arm64@2.5.8'
  - '@biomejs/cli-darwin-x64@2.5.8'
  - '@biomejs/cli-linux-arm64-musl@2.5.8'
  - '@biomejs/cli-linux-arm64@2.5.8'
  - '@biomejs/cli-linux-x64-musl@2.5.8'
  - '@biomejs/cli-linux-x64@2.5.8'
  - '@biomejs/cli-win32-arm64@2.5.8'
  - '@biomejs/cli-win32-x64@2.5.8'
  - zod@4.6.4
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
overrides:
  dompurify: ">=3.4.12"
