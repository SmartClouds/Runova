packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  cpu-features: false
  electron-winstaller: true
  esbuild: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - autoprefixer@10.5.4
  - caniuse-lite@1.0.30001806
  - vite@8.2.1
  - '@expo/cli@57.0.11'
  - '@expo/inline-modules@0.1.4'
  - '@expo/local-build-cache-provider@57.0.5'
  - '@expo/log-box@57.0.2'
  - '@expo/prebuild-config@57.0.10'
  - babel-preset-expo@57.0.5
  - expo-asset@57.0.8
  - expo-constants@57.0.8
  - expo-modules-core@57.0.8
  - expo@57.0.11
  - postcss@8.5.26
  - '@biomejs/biome@2.5.8'
  - '@biomejs/cli-darwin-arm64@2.5.8'
  - '@biomejs/cli-darwin-x64@2.5.8'
  - '@biomejs/cli-linux-arm64-musl@2.5.8'
  - '@biomejs/cli-linux-arm64@2.5.8'
  - '@biomejs/cli-linux-x64-musl@2.5.8'
  - '@biomejs/cli-linux-x64@2.5.8'
  - '@biomejs/cli-win32-arm64@2.5.8'
  - '@biomejs/cli-win32-x64@2.5.8'
  - zod@4.6.4
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
overrides:
  dompurify: ">=3.4.12"
