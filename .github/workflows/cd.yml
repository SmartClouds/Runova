name: CD

# Builds the Runova desktop app for Windows, macOS, and Linux and the server
# core the desktop installs on users' servers (linux-x64 and linux-arm64), and
# publishes all of it to a GitHub Release. It also pushes the
# website's API and site images to GitHub Container Registry. Once the release
# is out, the Windows installer goes to winget as a PR on microsoft/winget-pkgs
# (turned off until the installer is code signed, see the winget job).
#
# Triggers:
#   - Pushing a tag like "v1.2.3" builds and releases automatically.
#   - Manual "Run workflow" dispatch also works; supply the tag to release as.
#
# CD runs no tests of its own. CI already ran every check on the commit being
# released, so the first job here waits for CI on that commit and only lets the
# builds start once it passed. A tag on a commit CI failed on, or never ran on,
# releases nothing.
#
# Everything here runs on GitHub's hosted runners. CI has the self-hosted Linux
# runner to itself.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (e.g. v0.1.0). Required for manual runs."
        required: true

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Waits for CI on the commit this release builds from, instead of running the tests again. Any
  # CI run on that commit counts: the push to master, a pull request, or CI run by hand on the tag.
  # A tag pushed together with its commit starts here before CI is even listed, and CI may still
  # be queued behind other work on the self-hosted runner, hence the polling.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          waited=0
          while true; do
            runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20")"
            passed="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].html_url // empty' <<< "$runs")"
            if [ -n "$passed" ]; then
              echo "CI passed on $SHA: $passed"
              exit 0
            fi
            running="$(jq -r '[.workflow_runs[] | select(.status != "completed")][0].html_url // empty' <<< "$runs")"
            latest="$(jq -r '(.workflow_runs[0] // empty) | "\(.conclusion) \(.html_url)"' <<< "$runs")"
            if [ -n "$running" ]; then
              echo "CI is still running on $SHA: $running"
            elif [ -n "$latest" ]; then
              # A newer push to master cancels CI on the commit before it, so a tag on that commit
              # needs CI run on the tag itself (Actions, CI, Run workflow, pick the tag).
              echo "::error::CI did not pass on $SHA (${latest%% *}): ${latest#* }. Fix it, or run CI on the tag, then re-run this workflow."
              exit 1
            elif [ "$waited" -ge 300 ]; then
              echo "::error::CI never ran on $SHA. Push the commit to master, or run CI on the tag (Actions, CI, Run workflow), then re-run this workflow."
              exit 1
            fi
            sleep 30
            waited=$((waited + 30))
          done

  # The server core the Deploy section installs over SSH: self-contained single-file builds for
  # both Linux architectures, each a tar.gz with its SHA-256, and the manifest listing those
  # hashes. The desktop builds below embed the manifest, so an app only ever installs a core
  # whose hash it already knows. Attested, so a download can be traced back to this workflow.
  build-server-core:
    name: Build server core
    needs: ci-passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.4xx
          cache: true
          cache-dependency-path: apps/server-core/**/packages.lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Set server core version from release tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "SERVER_CORE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # CI=true makes these restores locked (Directory.Build.props), so the release is built from
      # exactly the packages in the lock files.
      - name: Publish linux-x64
        run: node scripts/server-core.mjs publish linux-x64

      - name: Publish linux-arm64
        run: node scripts/server-core.mjs publish linux-arm64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/server-core/artifacts/release/*.tar.gz

      - name: Upload server core release
        uses: actions/upload-artifact@v7
        with:
          name: server-core-release
          if-no-files-found: error
          path: |
            apps/server-core/artifacts/release/*.tar.gz
            apps/server-core/artifacts/release/*.sha256
            apps/server-core/artifacts/release/server-core-manifest.json

      # On its own as well, so the desktop builds fetch a few hundred bytes, not both tarballs.
      - name: Upload server core manifest
        uses: actions/upload-artifact@v7
        with:
          name: server-core-manifest
          if-no-files-found: error
          path: apps/server-core/artifacts/release/server-core-manifest.json

  build:
    name: Build (${{ matrix.os }})
    needs: [ci-passed, build-server-core]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_args: ""
          - os: ubuntu-latest
            build_args: ""
          # macos-latest runners are Apple Silicon (arm64) and macos-26-intel
          # runners are Intel (x64). macos-13, the previous Intel label, was
          # retired by GitHub in December 2025. electron-builder.yml targets
          # both mac arches, but native modules (better-sqlite3) only get
          # rebuilt for the host's own architecture, so each arch is built on
          # its matching runner.
          #
          # The arch has to be pinned as a "target:arch" pair, not with a bare
          # --arm64/--x64 flag: electron-builder only honours the CLI arch
          # flags when no target names are given, and the mac targets in
          # electron-builder.yml carry their own `arch: [x64, arm64]` lists,
          # which get expanded back in and make each runner build both arches
          # (the wrong one against the host's native modules).
          - os: macos-latest
            mac_arch: arm64
            build_args: "--mac dmg:arm64 zip:arm64"
          - os: macos-26-intel
            mac_arch: x64
            build_args: "--mac dmg:x64 zip:x64"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libfuse2 (required to build AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! sudo -n true 2> /dev/null; then
            echo "::error::libfuse2 is needed to build the AppImage. This runner has no passwordless sudo, so install it on the runner host: sudo apt-get install -y libfuse2"
            exit 1
          fi
          sudo -n apt-get update && sudo -n apt-get install -y libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version from release tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          export APP_VERSION="${TAG#v}"
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build core package
        run: pnpm --filter @runova/core build

      - name: Build protocol package
        run: pnpm --filter @runova/protocol build

      - name: Build studio package
        run: pnpm --filter @runova/studio build

      - name: Rebuild native modules for Electron
        run: pnpm --filter @runova/desktop rebuild:native

      - name: Build desktop app
        run: pnpm --filter @runova/desktop build

      # electron-builder.yml copies this into the app's resources; the Deploy section refuses to
      # install a server core whose hash is not in it.
      - name: Download server core manifest
        uses: actions/download-artifact@v8
        with:
          name: server-core-manifest
          path: apps/desktop/build

      # The Runova Anywhere agent (E64, E65), a self-contained executable the app ships so a
      # computer stays reachable while no one is signed in. electron-builder.yml copies it in.
      # Published on each OS's own runner: on a Mac, dotnet signs the file, which arm64 requires.
      - name: Setup .NET for the Anywhere agent
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.4xx

      - name: Publish the Anywhere agent
        run: node scripts/remote-agent.mjs publish ${{ runner.os == 'Windows' && 'win-x64' || runner.os == 'Linux' && 'linux-x64' || matrix.mac_arch == 'arm64' && 'osx-arm64' || 'osx-x64' }}

      # The Runova Connector plugin zip (E19). electron-builder.yml copies it into the app's
      # resources, so Deploy can hand it to the user to upload in wp-admin. Plain Node, no Docker.
      - name: Build the WordPress connector zip
        run: node scripts/wordpress-connector.mjs build

      # One copy goes on the GitHub Release, so a site owner can get it without the app.
      - name: Upload the WordPress connector zip
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-connector
          path: apps/wordpress-connector/dist/runova-connector.zip
          if-no-files-found: error

      # Spotlight indexes the disk image dmgbuild mounts while it is still
      # open, which keeps the volume busy and makes the unmount at the end of
      # the dmg build fail ("hdiutil: couldn't eject diskN - Resource busy").
      # Nothing on a throwaway runner needs the index.
      - name: Turn off Spotlight indexing
        if: startsWith(matrix.os, 'macos')
        run: sudo -n mdutil -a -i off || true

      # The dmg unmount above is racy even with indexing off, and a failed
      # unmount fails the whole build, so give it a couple of retries before
      # giving up. electron-builder is happy to overwrite its own output, so
      # a retry just redoes the work.
      - name: Package installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @runova/desktop exec electron-builder --publish never ${{ matrix.build_args }}; then
              exit 0
            fi
            echo "::warning::electron-builder failed on attempt $attempt of 3"
            sleep 30
          done
          exit 1

      # The app is ad-hoc signed (see electron-builder.yml). An arm64 app whose
      # signature is missing or broken won't launch at all, and the in-app
      # updater installs straight from this zip, so check the app inside it.
      - name: Verify macOS app signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          for zip in apps/desktop/release/*-mac.zip; do
            dir=$(mktemp -d)
            ditto -x -k "$zip" "$dir"
            codesign --verify --deep --strict --verbose=2 "$dir"/*.app
          done

      # electron-builder writes one `latest-mac.yml` per invocation. The two
      # macOS runners each package a single arch, so both would produce a
      # same-named file that clobbers the other once artifacts are merged in
      # the release job below, so rename each to keep them apart. The release
      # job merges them back into one `latest-mac.yml`.
      - name: Disambiguate macOS update manifest by arch
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: mv apps/desktop/release/latest-mac.yml apps/desktop/release/latest-mac-${{ matrix.mac_arch }}.yml

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.zip
            apps/desktop/release/latest.yml
            apps/desktop/release/latest-mac-*.yml
            apps/desktop/release/latest-linux.yml

  # The website's API and site images, pushed to GitHub Container Registry as
  # ghcr.io/<owner>/runova-website-api and ghcr.io/<owner>/runova-website-web, each tagged with the
  # release version and "latest". apps/website/docker-compose.production.yaml runs "latest", so
  # redeploying the website app in Runova picks the new release up. Prereleases get their version tag
  # only and leave "latest" where it was. The site's public settings are baked in at build time:
  # SITE_URL from the WEBSITE_SITE_URL repository variable (runovahq.com when unset) and its
  # Sentry DSN from WEBSITE_PUBLIC_SENTRY_DSN. Independent of the desktop release, so a failure
  # here never holds that back.
  build-website-images:
    name: Build website image (${{ matrix.image }})
    needs: ci-passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: apps/website/api
            dockerfile: apps/website/api/Dockerfile
          - image: web
            context: .
            dockerfile: apps/website/web/Dockerfile
          # Online monitoring (E54): the gateway nodes connect to, and the node itself.
          - image: monitoring-gateway
            context: apps/website/api
            dockerfile: apps/website/api/Dockerfile.gateway
          - image: monitoring-node
            context: apps/website/api
            dockerfile: apps/website/api/Dockerfile.node
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version and tags
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runova-website-${{ matrix.image }}"
          TAGS="$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) TAGS="$TAGS"$'\n'"$IMAGE:latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      # The site falls back to the desktop app's version when the API has no release to show.
      - name: Set app version from release tag
        if: matrix.image == 'web'
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=runova-website-${{ matrix.image }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
            SITE_URL=${{ vars.WEBSITE_SITE_URL || 'https://runovahq.com' }}
            PUBLIC_SENTRY_DSN=${{ vars.WEBSITE_PUBLIC_SENTRY_DSN }}
            SENTRY_ENVIRONMENT=production
            SENTRY_RELEASE=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=website-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=website-${{ matrix.image }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub Release
    needs: [build, build-server-core]
    runs-on: ubuntu-latest
    steps:
      # Only for scripts/merge-mac-manifest.mjs. It runs first because checkout
      # cleans the workspace.
      - name: Checkout release scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-installer-*
          path: dist-release
          merge-multiple: true

      # The tarballs, their .sha256 files and server-core-manifest.json. The app downloads the
      # tarball for its own version from this release and checks it against its embedded manifest.
      - name: Download server core release
        uses: actions/download-artifact@v8
        with:
          name: server-core-release
          path: dist-release

      - name: Download the WordPress connector zip
        uses: actions/download-artifact@v8
        with:
          name: wordpress-connector
          path: dist-release

      # electron-updater reads a single `latest-mac.yml`, but the two mac
      # runners each produced an arch-specific one (see the "Disambiguate" step
      # in the build job). Merge their `files:` lists so the updater on each
      # Mac can pick the zip for its own arch.
      - name: Merge macOS update manifests
        run: node scripts/merge-mac-manifest.mjs dist-release

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Runova ${{ steps.tag.outputs.tag }}
          draft: false
          files: dist-release/**/*

  # Opens a PR on microsoft/winget-pkgs for the new version, so `winget upgrade` finds it once
  # it's merged. The PR comes from the Cyrus-Sushiant fork of winget-pkgs and copies everything
  # but the version, URL and hash from the last published SmartClouds.Runova manifest.
  # WINGET_TOKEN is a classic PAT on that account with the public_repo scope (a fine-grained
  # token can't open a PR on a repo the account doesn't own). This runs after the release is
  # out, so a failure here never holds the release back; re-run the job once it's fixed.
  # Tags with a "-" (v1.2.3-beta.1) are prereleases and stay off winget.
  #
  # Turned off for now: the Windows installer needs a code signing certificate before it goes to
  # winget. Once it's signed, drop the "false &&" from the condition below to turn this back on.
  winget:
    name: Submit to winget
    needs: release
    if: ${{ false && !contains(github.ref_type == 'tag' && github.ref_name || inputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the winget-pkgs PR
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: SmartClouds.Runova
          release-tag: ${{ steps.tag.outputs.tag }}
          installers-regex: 'Runova-Setup-.*\.exe$'
          release-notes-url: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
          fork-user: Cyrus-Sushiant
          token: ${{ secrets.WINGET_TOKEN }}
