name: CD Mobile

# Builds the signed Android app and sends the iOS app to TestFlight for a release tag. It is its
# own workflow so a problem with a phone build can never hold up a desktop release.
#
# Both builds need secrets the repository owner sets once, listed in docs/mobile-release-setup.md.
# A build whose secrets are missing says so and is skipped, so the workflow is safe before then.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0). Required for manual runs."
        required: true

permissions:
  contents: write

concurrency:
  group: cd-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          waited=0
          while true; do
            runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20")"
            passed="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].html_url // empty' <<< "$runs")"
            if [ -n "$passed" ]; then
              echo "CI passed on $SHA: $passed"
              exit 0
            fi
            running="$(jq -r '[.workflow_runs[] | select(.status != "completed")][0].html_url // empty' <<< "$runs")"
            latest="$(jq -r '(.workflow_runs[0] // empty) | "\(.conclusion) \(.html_url)"' <<< "$runs")"
            if [ -n "$running" ]; then
              echo "CI is still running on $SHA: $running"
            elif [ -n "$latest" ]; then
              echo "::error::CI did not pass on $SHA (${latest%% *}): ${latest#* }. Fix it, or run CI on the tag, then re-run this workflow."
              exit 1
            elif [ "$waited" -ge 300 ]; then
              echo "::error::CI never ran on $SHA. Push the commit to master, or run CI on the tag, then re-run this workflow."
              exit 1
            fi
            sleep 30
            waited=$((waited + 30))
          done

  android:
    name: Android
    needs: ci-passed
    runs-on: ubuntu-latest
    # The build, then up to an hour waiting for the desktop workflow's release (the last step).
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.RUNOVA_ANDROID_KEYSTORE_BASE64 }}
      RUNOVA_ANDROID_STORE_PASSWORD: ${{ secrets.RUNOVA_ANDROID_STORE_PASSWORD }}
      RUNOVA_ANDROID_KEY_ALIAS: ${{ secrets.RUNOVA_ANDROID_KEY_ALIAS }}
      RUNOVA_ANDROID_KEY_PASSWORD: ${{ secrets.RUNOVA_ANDROID_KEY_PASSWORD }}
      RUNOVA_FIREBASE_API_KEY: ${{ secrets.RUNOVA_FIREBASE_API_KEY }}
      RUNOVA_FIREBASE_APP_ID: ${{ secrets.RUNOVA_FIREBASE_APP_ID }}
      RUNOVA_FIREBASE_PROJECT_ID: ${{ secrets.RUNOVA_FIREBASE_PROJECT_ID }}
      RUNOVA_FIREBASE_SENDER_ID: ${{ secrets.RUNOVA_FIREBASE_SENDER_ID }}
    steps:
      - name: Are the signing secrets set?
        id: secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$RUNOVA_ANDROID_STORE_PASSWORD" ] || [ -z "$RUNOVA_ANDROID_KEY_ALIAS" ] || [ -z "$RUNOVA_ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::The Android signing secrets are not all set, so no Android build was made. See docs/mobile-release-setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          # None set is a working app with no push. Some set is worse: with the API key there, the
          # app starts Firebase with the other values empty, and that throws at launch.
          firebase=$(printf '%s\n' "$RUNOVA_FIREBASE_API_KEY" "$RUNOVA_FIREBASE_APP_ID" "$RUNOVA_FIREBASE_PROJECT_ID" "$RUNOVA_FIREBASE_SENDER_ID" | grep -c . || true)
          case "$firebase" in
            4) ;;
            0) echo "::warning::The RUNOVA_FIREBASE_* secrets are not set, so this build will not receive push notifications. See docs/mobile-release-setup.md." ;;
            *) echo "::error::Only $firebase of the 4 RUNOVA_FIREBASE_* secrets are set. See docs/mobile-release-setup.md."; exit 1 ;;
          esac

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Setup Java
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        if: steps.secrets.outputs.ready == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Setup Rust
        if: steps.secrets.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        if: steps.secrets.outputs.ready == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Setup Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Build and sign
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/mobile/android
        env:
          # The runner presets ANDROID_NDK_ROOT to an older NDK, and cargo-ndk warns when the two differ.
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          # In two lines because eval would hide a tag the script refuses, such as v1.2.3-beta.1.
          version="$(node ../../../scripts/mobile-version.mjs "$TAG")"
          eval "$version"
          keystore="$RUNNER_TEMP/release.keystore"
          base64 --decode <<< "$KEYSTORE_BASE64" > "$keystore"
          RUNOVA_ANDROID_KEYSTORE="$keystore" ./gradlew :app:assembleRelease :app:bundleRelease \
            -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" \
            --console=plain --no-daemon
          rm -f "$keystore"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/runova-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/runova-$VERSION_NAME.aab"

      - name: Keep the build
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: runova-android
          retention-days: 7 # a copy goes on the GitHub Release
          path: apps/mobile/android/dist/*

      # The desktop workflow creates the release, and it may still be building.
      - name: Attach to the release
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" apps/mobile/android/dist/* --clobber
              exit 0
            fi
            sleep 30
          done
          echo "::warning::No release named $TAG appeared, so the build is only in this run's artifacts."

  ios:
    name: iOS
    needs: ci-passed
    # The self-hosted Mac, which also runs CI for pushes and approved pull requests as the same user
    # and keeps its disk between jobs. Nothing an earlier job could have left is trusted here: the
    # source is a fresh clone outside the shared workspace, every tool is downloaded into this job's
    # own temp folder and checked against a pinned SHA-256, the shell, git and PATH are the system's
    # own, and Cargo and Xcode build from scratch. The App Store Connect key only reaches the step
    # that uploads, and the token is read-only. The archive is signed for the App Store only, so
    # the Apple team needs no registered iPhone.
    runs-on: [self-hosted, macOS, ARM64]
    # Everything is built from nothing, including the three release-profile LTO builds of the core.
    timeout-minutes: 240
    permissions:
      contents: read
    defaults:
      run:
        # Not bash from PATH, where /opt/homebrew/bin and the like come first.
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SYSTEM_PATH: /usr/bin:/bin:/usr/sbin:/sbin
      # git without the runner user's own config, which could run commands (core.fsmonitor).
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      NODE_VERSION: v26.13.1
      NODE_SHA256: aec2514ea1ceb2ba52455e9ec65986f6749a06dd759e5db2a72e6889668c9735
      XCODEGEN_VERSION: 2.48.0
      XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
      RUSTUP_VERSION: 1.29.3
      RUSTUP_SHA256: 63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f
    steps:
      # The secrets are only handed to the two steps that use them, not to the job.
      - name: Is everything needed here?
        id: secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          export PATH="$SYSTEM_PATH"
          if [ -z "$KEY_BASE64" ] || [ -z "$TEAM_ID" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::warning::The App Store Connect secrets are not all set, so nothing went to TestFlight. See docs/mobile-release-setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! xcodebuild -version > /dev/null 2>&1; then
            echo "::warning::Xcode is not installed on this runner, so nothing went to TestFlight."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # A clone of its own in this job's temp folder, by the system's git, instead of the shared
      # workspace that CI jobs keep files in between runs.
      - name: Fresh source and tools
        if: steps.secrets.outputs.ready == 'true'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export PATH="$SYSTEM_PATH"
          work="$RUNNER_TEMP/ios-release"
          rm -rf "$work"
          mkdir -p "$work/tools"
          tools="$work/tools"

          git init -q "$work/src"
          git -C "$work/src" fetch -q --depth 1 "$REPO_URL" "$GITHUB_SHA"
          git -C "$work/src" checkout -q --detach FETCH_HEAD

          # Cargo reads .cargo/config.toml from every folder above the one it runs in, and the
          # same user could have left one there to wrap rustc.
          dir="$work/src/apps/mobile/core"
          while [ "$dir" != "/" ]; do
            dir=$(dirname "$dir")
            for name in config config.toml; do
              if [ -e "$dir/.cargo/$name" ]; then
                echo "::error::$dir/.cargo/$name would change how Cargo builds the release. Remove it from the Mac, then run this again."
                exit 1
              fi
            done
          done

          fetch() { # url sha256 file
            curl -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | shasum -a 256 -c - > /dev/null
          }
          fetch "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-darwin-arm64.tar.gz" "$NODE_SHA256" "$tools/node.tar.gz"
          mkdir "$tools/node"
          tar -xzf "$tools/node.tar.gz" -C "$tools/node" --strip-components 1
          fetch "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" "$XCODEGEN_SHA256" "$tools/xcodegen.zip"
          unzip -q "$tools/xcodegen.zip" -d "$tools"
          fetch "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/aarch64-apple-darwin/rustup-init" "$RUSTUP_SHA256" "$tools/rustup-init"
          chmod +x "$tools/rustup-init"
          CARGO_HOME="$tools/cargo" RUSTUP_HOME="$tools/rustup" "$tools/rustup-init" -y -q --no-modify-path \
            --profile minimal --default-toolchain stable \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim --target x86_64-apple-ios

          {
            echo "RELEASE_SRC=$work/src"
            echo "RELEASE_TOOLS=$tools"
            echo "RELEASE_PATH=$tools/node/bin:$tools/cargo/bin:$tools/xcodegen/bin:$SYSTEM_PATH"
            echo "CARGO_HOME=$tools/cargo"
            echo "RUSTUP_HOME=$tools/rustup"
            echo "CARGO_TARGET_DIR=$tools/target"
          } >> "$GITHUB_ENV"

      - name: Build the core and the project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          export PATH="$RELEASE_PATH"
          cd "$RELEASE_SRC"
          sh apps/mobile/ios/scripts/build-core.sh
          cd apps/mobile/ios && xcodegen generate

      - name: Archive and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          export PATH="$RELEASE_PATH"
          cd "$RELEASE_SRC/apps/mobile/ios"
          # It goes into sed and the entitlements below, so it has to look like a Team ID.
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID is not a ten-character Team ID. See docs/mobile-release-setup.md."
            exit 1
          fi
          version="$(node ../../../scripts/mobile-version.mjs "$TAG")"
          eval "$version"
          key="$RELEASE_TOOLS/AuthKey.p8"
          (umask 077; base64 --decode <<< "$KEY_BASE64" > "$key")
          trap 'rm -f "$key"' EXIT
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          # Its own DerivedData and package folder, not the ones CI's builds leave in ~/Library.
          built=(-derivedDataPath "$RELEASE_TOOLS/DerivedData" -clonedSourcePackagesDirPath "$RELEASE_TOOLS/SourcePackages")
          archive="$RUNNER_TEMP/Runova.xcarchive"
          group="$TEAM_ID.com.runovahq.app.shared"

          # Archived unsigned, then signed once, for the App Store, by the export (as CuraLink
          # does). Signing the archive would make automatic signing get a development profile
          # first, and Apple only issues those to a team with a registered device ("Your team has
          # no devices from which to generate a provisioning profile"). The App Store profile
          # needs none. Signing is also what normally fills in AppIdentifierPrefix, which both
          # Info.plists use for the shared keychain group, so it is given here.
          xcodebuild archive -project Runova.xcodeproj -scheme Runova \
            -destination "generic/platform=iOS" -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO AppIdentifierPrefix="$TEAM_ID." \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$VERSION_CODE" "${built[@]}"

          # The export keeps the entitlements it finds in each binary's signature, and an unsigned
          # archive has none, so the App Store build would quietly lose push, passkeys, Sign in
          # with Apple and the shared keychain. An ad-hoc signature carries them into the archive
          # without a profile, and the export replaces it. XcodeGen writes the files with
          # $(AppIdentifierPrefix), which only a signing build fills in, and with push set to
          # development, so each is resolved first. The extension goes first because codesign
          # refuses a bundle whose nested code is unsigned.
          app="$archive/Products/Applications/Runova.app"
          adhoc() { # bundle entitlements
            local resolved
            resolved="$RUNNER_TEMP/$(basename "$2")"
            sed "s/[$](AppIdentifierPrefix)/$TEAM_ID./g" "$2" > "$resolved"
            if /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$resolved" > /dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c 'Set :aps-environment production' "$resolved"
            fi
            plutil -lint -s "$resolved"
            if [ -d "$1/Frameworks" ]; then
              find "$1/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
                -exec codesign --force --sign - --timestamp=none {} +
            fi
            codesign --force --sign - --timestamp=none --entitlements "$resolved" "$1"
          }
          adhoc "$app/PlugIns/RunovaNotifications.appex" RunovaNotifications/RunovaNotifications.entitlements
          adhoc "$app" Runova/Runova.entitlements

          # The version comes from the tag, so Xcode must not renumber the build on its way up.
          export_to() { # destination folder
            cat > "$RUNNER_TEMP/export-$1.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>$1</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
            xcodebuild -exportArchive -archivePath "$archive" \
              -exportOptionsPlist "$RUNNER_TEMP/export-$1.plist" -exportPath "$2" "${auth[@]}"
          }

          # Signed into a folder first, to check what the App Store signature kept before anything
          # reaches TestFlight. An App ID without a capability drops that entitlement with no
          # error, and the feature then just fails on the phone.
          export_to export "$RUNNER_TEMP/export"
          ipas=("$RUNNER_TEMP"/export/*.ipa)
          if [ ! -f "${ipas[0]}" ]; then
            echo "::error::The export made no .ipa in $RUNNER_TEMP/export."
            exit 1
          fi
          unzip -q "${ipas[0]}" -d "$RUNNER_TEMP/unpacked"
          signed="$RUNNER_TEMP/unpacked/Payload/Runova.app"
          extension="$signed/PlugIns/RunovaNotifications.appex"
          check() { # bundle text what-to-do
            local entitlements
            entitlements=$(codesign -d --entitlements - --xml "$1" 2>/dev/null || true)
            if ! grep -qF "$2" <<< "$entitlements"; then
              echo "::error::$(basename "$1") was signed without $2. $3"
              exit 1
            fi
          }
          capability() { echo "Turn on $1 for com.runovahq.app in the Apple developer account (docs/mobile-release-setup.md), then run this again."; }
          check "$signed" "<key>aps-environment</key>" "$(capability "Push Notifications")"
          check "$signed" "webcredentials:runovahq.com" "$(capability "Associated Domains")"
          check "$signed" "com.apple.developer.applesignin" "$(capability "Sign in with Apple")"
          check "$signed" "$group" "The ad-hoc signing above did not carry the keychain group."
          check "$extension" "$group" "The ad-hoc signing above did not carry the keychain group."
          for bundle in "$signed" "$extension"; do
            read_group=$(plutil -extract RunovaKeychainGroup raw -o - "$bundle/Info.plist" || true)
            if [ "$read_group" != "$group" ]; then
              echo "::error::$(basename "$bundle") reads its keychain group as '$read_group', not $group."
              exit 1
            fi
          done

          # The upload signs the same archive the same way, so TestFlight gets what was checked.
          export_to upload "$RUNNER_TEMP/upload"
