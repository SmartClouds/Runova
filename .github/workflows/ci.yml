name: CI

# Checks every push and pull request: formatting/lint (Biome), no deprecated
# dependencies or deprecated imports, types, a real build of the desktop app,
# and every test suite: unit, integration, the system tests on Docker
# test servers and the end-to-end run on Linux and macOS.
#
# It runs on our two self-hosted runners (CD never uses them). Everything that
# does not care about the OS (lint, types, the build and the unit suites)
# runs on the Mac mini, which is much faster. The Linux runner keeps
# what needs Linux: Docker and the server core. The macOS end-to-end shards
# run on the Mac too. The website (its site, its API, the Playwright specs and
# the compose stack with Lighthouse) and the desktop app's Linux end-to-end
# shards run on CircleCI, in .circleci/config.yml, and the circleci jobs below
# wait for them. GitHub's hosted runners are for CD, which packages the
# installers.
#
# The self-hosted runners keep their disks between jobs, so every job that runs on one starts with
# the Runner cleanup step (.github/actions/runner-cleanup). It gives the job a temp folder of its
# own, and its post step, which runs even when the job fails or is cancelled, deletes what the job
# left behind: test containers, temp folders and the workspace, and once a day the cache entries
# and tool versions nothing uses any more. It also keeps each runner's pnpm store between jobs.
# The Mac mini runs on a hard disk, so it keeps node_modules too and only clears the rest of the
# workspace, at the start of each job.
#
# On the Linux runner, a job's run steps run in a container that the job starts after its setup
# actions and removes at the end, with every process left in it (.github/ci-container). It shares
# the host's paths, network and Docker, so the steps are the same as on the host. The system
# packages the steps need (Electron's libraries, Xvfb, ffmpeg) live in its image, not on the host.
#
# The jobs do not wait for each other, and the desktop unit and end-to-end
# suites are split into shards, so a run is only as fast as the number of
# runners online allows. With one runner every job queues behind the last.
#
# The repository is public, and a pull request from a fork would run its own
# code on our machine, so pull requests only run here from branches of this
# repository. Fork pull requests get no CI until a maintainer pushes the
# branch here.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On Linux x64, onnxruntime-node's postinstall downloads its CUDA and TensorRT libraries (about
# 200 MB) from api.nuget.org. The app transcribes on the CPU and never loads them, and a slow
# connection to NuGet failed a whole install (run 179). The CPU runtime ships in the npm package.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

# A push to master does not cancel the run in progress. A whole run takes over two hours on our
# runners and master gets a push about every half hour, so with cancelling no run finished: 59 of
# the 60 runs from 2026-11-09 to 11-11 were cancelled. Now the run in progress finishes, the
# newest push waits, and a push that is still waiting is replaced by the next one. Other branches
# and pull requests still cancel, since only their newest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: Lint, types, build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Mac keeps node_modules between jobs, and Runner cleanup clears the rest (see
          # keepsDependencies in .github/actions/runner-cleanup/shared.mjs).
          clean: ${{ runner.os != 'macOS' }}

      - name: Runner cleanup
        uses: ./.github/actions/runner-cleanup

      # Node first: pnpm's installer runs npm from PATH, and without one it falls back to the
      # runner's own npm, which a runner self-update leaves broken (actions/runner#2094).
      # No cache: pnpm here. The self-hosted runner keeps its pnpm store between
      # jobs (Runner cleanup sets where), and a round trip through GitHub's cache only cost time.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # pnpm installs itself into its store's links folder and reuses an entry there without
        # checking it is whole, so its own install gets a store inside dest, which setup wipes
        # every time. The workspace's packages go in the store Runner cleanup sets.
        env:
          pnpm_config_store_dir: ${{ runner.environment == 'self-hosted' && format('{0}/setup-pnpm/store', runner.tool_cache) || '' }}
        with:
          # One pnpm per runner: two runners share this machine, and a shared ~/setup-pnpm let
          # one job's setup delete files the other was using.
          dest: ${{ runner.tool_cache }}/setup-pnpm

      # --frozen-lockfile also fails the build when package.json and
      # pnpm-lock.yaml have drifted apart.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `biome ci` = formatter + linter + import sorting in one pass, without
      # writing anything. --reporter=github turns findings into inline
      # annotations on the pull request.
      - name: Biome (format, lint, import order)
        if: ${{ !cancelled() }}
        run: pnpm biome:ci --reporter=github

      # Anything we import that upstream has marked @deprecated. This is the
      # lint/suspicious/noDeprecatedImports rule on its own, so a failure here
      # says "deprecated API" rather than "some lint rule".
      - name: No deprecated code
        if: ${{ !cancelled() }}
        run: pnpm check:deprecated-code --reporter=github

      # Direct dependencies the npm registry reports as deprecated. Known
      # exceptions live in .github/deprecated-deps-allowlist.json.
      - name: No deprecated dependencies
        if: ${{ !cancelled() }}
        run: pnpm check:deprecated-deps

      # The self-hosted runners have no passwordless sudo, so a bare sudo there fails on a
      # password prompt without saying what was missing (scripts/workflow-sudo.mjs).
      - name: No workflow waits for a sudo password
        if: ${{ !cancelled() }}
        run: node --test scripts/workflow-sudo.test.mjs

      # The desktop type-checks against @runova/core and
      # @runova/protocol declaration output, so those have to be built first.
      - name: Build workspace packages
        if: ${{ !cancelled() }}
        run: pnpm --filter @runova/core --filter @runova/protocol --filter @runova/studio build

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm -r typecheck

      # better-sqlite3 and node-pty stay external in the bundle, so this needs
      # no native rebuild. Packaging installers is CD's job.
      - name: Build desktop app
        if: ${{ !cancelled() }}
        run: pnpm --filter @runova/desktop build

  # Every suite on every run, the end-to-end and system tests included. The self-hosted runner
  # costs nothing per minute, so there is no [e2e] opt-in here any more.
  tests:
    name: Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/test.yml
    with:
      e2e: true

  # The website (the site, its API, the Playwright specs, the compose stack and Lighthouse) and the
  # desktop app's Linux end-to-end shards run on CircleCI, in .circleci/config.yml. CircleCI reports
  # each job on the commit as a status named "ci/circleci: <job>". This job has one copy per
  # CircleCI job, so each shows up on its own in the run, and each waits for its job's status, so
  # all-green below, and with it CD's ci-passed, fail when one of them fails. Hosted, like CD's own
  # wait: it only polls. A job added to .circleci/config.yml needs adding to the list here too.
  #
  # A job that is still running is waited for. One that fails ends its copy at once. One that never
  # reports (CircleCI is not triggered, or its config is broken) fails it after 15 minutes. Rerun a
  # copy after rerunning its failed CircleCI job: it reads the latest status.
  #
  # desktop-e2e-linux has not passed on CircleCI yet, so its copy shows a failure without failing
  # the run, as the server core's jobs did before they were gated. Drop continue-on-error once it
  # is green.
  circleci:
    name: CircleCI (${{ matrix.job }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: ${{ matrix.job == 'desktop-e2e-linux' }}
    strategy:
      fail-fast: false
      matrix:
        job: [website-web, website-api, website-e2e, desktop-e2e-linux]
    permissions:
      statuses: read
    steps:
      - name: Wait for ${{ matrix.job }} on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # A pull request's own commit, not the merge commit the workflow runs on.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB: ${{ matrix.job }}
        run: |
          waited=0
          while true; do
            # The latest status of this job's CircleCI context.
            state="$(gh api "repos/$REPO/commits/$SHA/statuses?per_page=100" --jq "[.[] | select(.context == \"ci/circleci: $JOB\")] | sort_by(.created_at) | last | .state // \"\"")"
            case "$state" in
              success)
                echo "CircleCI job $JOB passed on $SHA"
                exit 0
                ;;
              failure|error)
                echo "::error::CircleCI job $JOB ended as $state on $SHA. Open the ci/circleci: $JOB status on the commit."
                exit 1
                ;;
              pending) ;;
              *)
                if [ "$waited" -ge 900 ]; then
                  echo "::error::CircleCI never reported $JOB on $SHA. Check that the project follows this repository and that .circleci/config.yml is valid."
                  exit 1
                fi
                ;;
            esac
            echo "Waiting for CircleCI job $JOB (${state:-not reported yet})"
            sleep 30
            waited=$((waited + 30))
          done

  # One status to require in branch protection: the matrix job names change whenever the OS list
  # does, and a skipped job would otherwise count as success. Left out for a fork pull request,
  # so the required status stays pending instead of passing on tests that never ran.
  all-green:
    name: All checks passed
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [check, tests, circleci]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Fail if anything failed, was cancelled or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
