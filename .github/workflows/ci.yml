name: CI

# Checks every push and pull request: formatting/lint (Biome), no deprecated
# dependencies or deprecated imports, types, a real build of the desktop app,
# and every test suite: unit, integration, mobile, the system tests on Docker
# test servers and the end-to-end run on Linux and macOS.
#
# It runs on our two self-hosted runners (CD never uses them). Everything that
# does not care about the OS (lint, types, the build, the unit suites and
# mobile) runs on the Mac mini, which is much faster. The Linux runner keeps
# what needs Linux: Docker, the server core, the website (its API, its site and
# the compose stack they run in) and the Linux end-to-end shards. The macOS
# end-to-end shards run on the Mac too. GitHub's hosted runners are
# for CD, which packages the installers.
#
# The self-hosted runners keep their disks between jobs, so every job that runs on one starts with
# the Runner cleanup step (.github/actions/runner-cleanup). It gives the job a temp folder of its
# own, and its post step, which runs even when the job fails or is cancelled, deletes what the job
# left behind: test containers, temp folders and the workspace, and once a day the cache entries
# and tool versions nothing uses any more. It also keeps each runner's pnpm store between jobs.
# The Mac mini runs on a hard disk, so it keeps node_modules too and only clears the rest of the
# workspace, at the start of each job.
#
# The jobs do not wait for each other, and the desktop unit and end-to-end
# suites are split into shards, so a run is only as fast as the number of
# runners online allows. With one runner every job queues behind the last.
#
# The repository is public, and a pull request from a fork would run its own
# code on our machine, so pull requests only run here from branches of this
# repository. Fork pull requests get no CI until a maintainer pushes the
# branch here.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On Linux x64, onnxruntime-node's postinstall downloads its CUDA and TensorRT libraries (about
# 200 MB) from api.nuget.org. The app transcribes on the CPU and never loads them, and a slow
# connection to NuGet failed a whole install (run 179). The CPU runtime ships in the npm package.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Mac keeps node_modules between jobs, and Runner cleanup clears the rest (see
          # keepsDependencies in .github/actions/runner-cleanup/shared.mjs).
          clean: ${{ runner.os != 'macOS' }}

      - name: Runner cleanup
        uses: ./.github/actions/runner-cleanup

      # Node first: pnpm's installer runs npm from PATH, and without one it falls back to the
      # runner's own npm, which a runner self-update leaves broken (actions/runner#2094).
      # No cache: pnpm here. The self-hosted runner keeps its pnpm store between
      # jobs (Runner cleanup sets where), and a round trip through GitHub's cache only cost time.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # pnpm installs itself into its store's links folder and reuses an entry there without
        # checking it is whole, so its own install gets a store inside dest, which setup wipes
        # every time. The workspace's packages go in the store Runner cleanup sets.
        env:
          pnpm_config_store_dir: ${{ runner.environment == 'self-hosted' && format('{0}/setup-pnpm/store', runner.tool_cache) || '' }}
        with:
          # One pnpm per runner: two runners share this machine, and a shared ~/setup-pnpm let
          # one job's setup delete files the other was using.
          dest: ${{ runner.tool_cache }}/setup-pnpm

      # --frozen-lockfile also fails the build when package.json and
      # pnpm-lock.yaml have drifted apart.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `biome ci` = formatter + linter + import sorting in one pass, without
      # writing anything. --reporter=github turns findings into inline
      # annotations on the pull request.
      - name: Biome (format, lint, import order)
        if: ${{ !cancelled() }}
        run: pnpm biome:ci --reporter=github

      # Anything we import that upstream has marked @deprecated. This is the
      # lint/suspicious/noDeprecatedImports rule on its own, so a failure here
      # says "deprecated API" rather than "some lint rule".
      - name: No deprecated code
        if: ${{ !cancelled() }}
        run: pnpm check:deprecated-code --reporter=github

      # The app's name from before the rename to Runova, outside the places that read installs
      # from before it (scripts/check-legacy-names.mjs says which those are).
      - name: No stray old app name
        if: ${{ !cancelled() }}
        run: pnpm check:legacy-names

      # Direct dependencies the npm registry reports as deprecated. Known
      # exceptions live in .github/deprecated-deps-allowlist.json.
      - name: No deprecated dependencies
        if: ${{ !cancelled() }}
        run: pnpm check:deprecated-deps

      # Desktop and mobile type-check against @runova/core and
      # @runova/protocol declaration output, so those have to be built first.
      - name: Build workspace packages
        if: ${{ !cancelled() }}
        run: pnpm --filter @runova/core --filter @runova/protocol --filter @runova/studio build

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm -r typecheck

      # better-sqlite3 and node-pty stay external in the bundle, so this needs
      # no native rebuild. Packaging installers is CD's job.
      - name: Build desktop app
        if: ${{ !cancelled() }}
        run: pnpm --filter @runova/desktop build

  # Every suite on every run, the end-to-end and system tests included. The self-hosted runner
  # costs nothing per minute, so there is no [e2e] opt-in here any more.
  tests:
    name: Tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/test.yml
    with:
      e2e: true

  # The website API (apps/website/api). Its global.json pins the SDK feature band and the
  # Microsoft.Testing.Platform runner, so every dotnet command runs from that folder. The
  # integration tests start PostgreSQL with Testcontainers, so this needs the Linux runner's Docker.
  website-api:
    name: Website API
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        working-directory: apps/website/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runner cleanup
        uses: ./.github/actions/runner-cleanup

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # The default, /usr/share/dotnet, needs root, which a self-hosted runner may not have.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx

      # Locked: the lock files are what was reviewed. Known high or critical vulnerabilities fail
      # this step through NuGet audit.
      - name: Restore
        run: dotnet restore Runova.Website.slnx --locked-mode

      - name: Format
        run: dotnet format Runova.Website.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Runova.Website.slnx --no-restore --configuration Release

      - name: Unit and integration tests
        run: dotnet test --solution Runova.Website.slnx --no-build --configuration Release --output Detailed

  # The website (apps/website/web): lint, types, unit tests and the build, the e2e suite (a fake
  # API, plus the real API and PostgreSQL for the admin pages), then the compose stack the way
  # production runs it, with the full-stack specs and Lighthouse against it. The e2e admin stack
  # needs Node (Testcontainers), the .NET SDK and Docker, so this runs on Linux too.
  website-web:
    name: Website
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    # One compose stack per machine at a time: they would fight over its ports.
    concurrency: website-stack
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # The runova-e2e- prefix lets Runner cleanup remove the stack if a cancelled run leaves it.
      COMPOSE_PROJECT_NAME: runova-e2e-website
      HTTP_PORT: "18080"
      HTTPS_PORT: "18443"
      STACK_URL: https://localhost:18443
      STACK_HTTP_URL: http://localhost:18080
    defaults:
      run:
        working-directory: apps/website/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runner cleanup
        uses: ./.github/actions/runner-cleanup

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx

      # Node before pnpm, as in the check job. The astro CLI runs on Node and asks for a newer 22
      # than one runner had in its tool cache, so take the latest 22 rather than a cached one.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true

      # The unit tests ask pnpm whether the site stays outside the repository's workspace. Set up
      # the way the check job does it (see the comments there).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          pnpm_config_store_dir: ${{ runner.environment == 'self-hosted' && format('{0}/setup-pnpm/store', runner.tool_cache) || '' }}
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        if: ${{ !cancelled() }}
        run: bunx biome ci --reporter=github .

      - name: Astro check
        if: ${{ !cancelled() }}
        run: bun run check

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: bun run test

      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Playwright browser
        run: bunx playwright install chromium

      - name: End-to-end tests
        run: bun run e2e

      # SITE_URL only here: the e2e build above must keep the default, which its fixtures (and the
      # CSP that allows their runovahq.com images) expect.
      - name: Start the compose stack
        id: stack
        env:
          SITE_URL: https://localhost:18443
        run: docker compose -f ../compose.yaml up --detach --build --wait

      - name: Full-stack tests
        run: bun run e2e:stack

      # Even when a full-stack spec fails, but only on a stack that came up.
      - name: Lighthouse against the stack
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: bun run lighthouse:stack

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose -f ../compose.yaml logs --no-color --tail 300

      - name: Stop the compose stack
        if: ${{ always() }}
        run: docker compose -f ../compose.yaml down --volumes --remove-orphans

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-reports
          path: |
            apps/website/web/test-results
            apps/website/web/.lighthouseci
          if-no-files-found: ignore

  # One status to require in branch protection: the matrix job names change whenever the OS list
  # does, and a skipped job would otherwise count as success. Left out for a fork pull request,
  # so the required status stays pending instead of passing on tests that never ran.
  all-green:
    name: All checks passed
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [check, tests, website-api, website-web]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Fail if anything failed, was cancelled or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
