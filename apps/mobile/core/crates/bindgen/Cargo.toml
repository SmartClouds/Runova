[package]
name = "runova-bindgen"
version.workspace = true
edition.workspace = true
publish.workspace = true

# UniFFI's binding generator, which writes the Swift and Kotlin for runova-ffi from its built
# library. A crate of its own so that running it compiles only uniffi's generator, not the whole
# core a second time for this computer (that took 25 minutes on the CI Mac).
[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
