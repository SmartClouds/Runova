name: Runova
options:
  bundleIdPrefix: com.runovahq
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  Runova:
    type: application
    platform: iOS
    sources:
      - Runova
      - Generated
      - path: ../design/fonts
        type: folder
        buildPhase: resources
      - path: ../design/brand
        type: folder
        buildPhase: resources
    entitlements:
      path: Runova/Runova.entitlements
      properties:
        aps-environment: production
    dependencies:
      - framework: Frameworks/RunovaCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runovahq.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Runova
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        OTHER_SWIFT_FLAGS: -fmodule-map-file=$(SRCROOT)/Generated/runova_ffiFFI.modulemap
    info:
      path: Runova/Info.plist
      properties:
        NSFaceIDUsageDescription: Confirms it's you before showing a Vault secret.
        UIAppFonts:
          - fonts/Inter.ttf
          - fonts/JetBrainsMono.ttf
          - fonts/FontAwesomeSolid.ttf
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.runovahq.app
  RunovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RunovaTests
    dependencies:
      - target: Runova
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: -fmodule-map-file=$(SRCROOT)/Generated/runova_ffiFFI.modulemap
schemes:
  Runova:
    build:
      targets:
        Runova: all
        RunovaTests: [test]
    test:
      targets:
        - RunovaTests
