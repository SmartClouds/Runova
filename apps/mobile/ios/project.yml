name: Runova
options:
  bundleIdPrefix: com.runovahq
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # With GENERATE_INFOPLIST_FILE on, these fill CFBundleShortVersionString and CFBundleVersion.
    # Without them an embedded extension has no bundle version and the simulator refuses to install it.
    # Release builds pass the real values from the tag on the xcodebuild command line.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Runova:
    type: application
    platform: iOS
    sources:
      - Runova
      - Shared
      - Generated
      - path: ../design/fonts
        type: folder
        buildPhase: resources
      - path: ../design/brand
        type: folder
        buildPhase: resources
    entitlements:
      path: Runova/Runova.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          # The first group is where items go by default, so the identity seed stays out of the shared one.
          - $(AppIdentifierPrefix)com.runovahq.app
          - $(AppIdentifierPrefix)com.runovahq.app.shared
    dependencies:
      - framework: Frameworks/RunovaCore.xcframework
        embed: false
      - target: RunovaNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runovahq.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Runova
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/Generated/runova_ffiFFI.modulemap
    info:
      path: Runova/Info.plist
      properties:
        NSFaceIDUsageDescription: Confirms it's you before showing a Vault secret.
        NSCameraUsageDescription: Reads the QR code that signs you in.
        RunovaKeychainGroup: $(AppIdentifierPrefix)com.runovahq.app.shared
        UIAppFonts:
          - fonts/Inter.ttf
          - fonts/JetBrainsMono.ttf
          - fonts/FontAwesomeSolid.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.runovahq.app
  RunovaNotifications:
    type: app-extension
    platform: iOS
    sources:
      - RunovaNotifications
      - Shared
      - Generated
    entitlements:
      path: RunovaNotifications/RunovaNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.runovahq.app.shared
    dependencies:
      - framework: Frameworks/RunovaCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runovahq.app.notifications
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Runova Notifications
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/Generated/runova_ffiFFI.modulemap
    info:
      path: RunovaNotifications/Info.plist
      properties:
        RunovaKeychainGroup: $(AppIdentifierPrefix)com.runovahq.app.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  RunovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RunovaTests
    dependencies:
      - target: Runova
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/Generated/runova_ffiFFI.modulemap
        # XCTest in current Xcode is built for iOS 17, so a test bundle for 16.0 linked with a
        # warning. The tests only run on current simulators; the app itself still supports 16.0.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  Runova:
    build:
      targets:
        Runova: all
        RunovaTests: [test]
    test:
      targets:
        - RunovaTests
