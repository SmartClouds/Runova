// The link between a monitoring node and the Monitoring Gateway (E54). It runs over HTTP/2 with
// TLS 1.3 and client certificates: who a node is comes from its certificate, never from a field
// in these messages.
syntax = "proto3";

package runova.monitoring.v1;

option csharp_namespace = "Runova.Monitoring.Contracts.Grpc";

import "google/protobuf/timestamp.proto";

service NodeLink {
  // One stream per node for as long as it runs. A second stream from the same node replaces the
  // first.
  rpc Connect(stream NodeMessage) returns (stream ServerMessage);

  // A fresh certificate for the key the node already holds, asked with the certificate it has.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

message NodeMessage {
  oneof body {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    ResultBatch results = 3;
  }
}

// The first message on every stream.
message Hello {
  string version = 1;
  // The assignment version the node holds (0 when it has none).
  int64 assignment_version = 2;
  // How many checks the node runs at the same time.
  int32 concurrency = 3;
}

message Heartbeat {
  int32 monitors = 1;
  int32 checks_last_minute = 2;
  // Results waiting in the node's outbox.
  int32 queued_results = 3;
  // How late the scheduler is running its checks, in milliseconds.
  int32 lag_ms = 4;
}

message ResultBatch {
  // A UUID the node makes; BatchAck names it.
  string batch_id = 1;
  repeated CheckResult results = 2;
}

message CheckResult {
  // A UUIDv7 the node makes, so the server stores every result once.
  string id = 1;
  int64 monitor_id = 2;
  int64 monitor_version = 3;
  google.protobuf.Timestamp checked_at = 4;
  // pass, warn, fail, unreachable, unauthorized or invalid.
  string state = 5;
  // 0 when no answer came.
  int32 http_status = 6;
  // -1 when no answer came.
  int32 latency_ms = 7;
  // Why the probe got no good report, already redacted.
  string problem = 8;
  // The services that were not passing, already redacted.
  repeated ServiceProblem services = 9;
  // Set when this result answers a ConfirmCheck.
  string confirm_id = 10;
}

message ServiceProblem {
  string key = 1;
  // warn or fail.
  string status = 2;
  string message = 3;
}

message ServerMessage {
  oneof body {
    AssignmentSnapshot snapshot = 1;
    AssignmentDelta delta = 2;
    ConfirmCheck confirm = 3;
    Drain drain = 4;
    BatchAck ack = 5;
  }
}

message MonitorDefinition {
  int64 id = 1;
  int64 version = 2;
  string url = 3;
  int32 interval_sec = 4;
  int32 timeout_sec = 5;
  // bearer, basic or empty.
  string auth_mode = 6;
  // Kept in the node's memory only, never on its disk.
  string secret = 7;
  bool allow_insecure = 8;
}

// Everything the node should check, replacing what it had.
message AssignmentSnapshot {
  int64 assignment_version = 1;
  repeated MonitorDefinition monitors = 2;
}

// What changed since the version the node holds.
message AssignmentDelta {
  int64 assignment_version = 1;
  repeated MonitorDefinition upserts = 2;
  repeated int64 removed = 3;
}

// Check this monitor once, now, to confirm another node's result.
message ConfirmCheck {
  string confirm_id = 1;
  MonitorDefinition monitor = 2;
}

// Stop checking: the node is drained.
message Drain {
  string reason = 1;
}

message BatchAck {
  string batch_id = 1;
}

message RenewCertificateRequest {
  // A PKCS#10 request for the key the node already holds, DER encoded.
  bytes csr = 1;
}

message RenewCertificateResponse {
  // DER encoded.
  bytes certificate = 1;
  repeated bytes ca_certificates = 2;
}
